import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

buildscript {
    repositories {
        mavenCentral()
        maven {
            name = 'forge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
    dependencies {
        classpath('com.anatawa12.forge:ForgeGradle:1.2-1.1.1') {
            changing = false
        }
    }
}

plugins {
    id 'com.github.johnrengelman.shadow' version '5.2.0'
}

apply plugin: 'forge'
apply plugin: 'idea'
apply plugin: 'eclipse'

sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8

group = 'com.replaymod'
version = file('version.txt').text.trim()
archivesBaseName = 'ReplayMod-WDG'

ext.minecraftBaseVersion = '1.7.10'

minecraft {
    version = '1.7.10-10.13.4.1614-1.7.10'
    mappings = 'stable_12'
    runDir = 'eclipse'
}

// ForgeGradle 1.2 preprocesses the Java source through sourceMainJava before compilation.
// Keep the mod annotation version in lockstep with version.txt without reintroducing ReplayMod's multi-version preprocessor.
tasks.sourceMainJava.replace '@MOD_VERSION@', project.version
tasks.sourceMainJava.replace '@MC_VERSION@', '[1.7.10]'

ext {
    mixinSrg = new File(project.buildDir, 'tmp/mixins/mixins.srg')
    mixinRefMap = new File(project.buildDir, 'tmp/mixins/mixins.replaymod.refmap.json')
}

configurations {
    shade
    shadow
    // jGui ships as an SRG-named production jar. Keep that jar out of the
    // deobfuscated development classpath and use the pinned MCP-named copy there instead.
    jguiDev
    jguiProduction
    compile.extendsFrom shade
    compile.extendsFrom shadow
    compile.extendsFrom jguiDev
}

def shadeExclusions = {
    exclude group: 'com.google.guava', module: 'guava-jdk5'
    exclude group: 'com.google.guava', module: 'guava'
    exclude group: 'com.google.code.gson', module: 'gson'
}

repositories {
    mavenCentral()
    maven {
        name = 'sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    maven { url = 'https://jitpack.io' }
    flatDir { dirs 'libs' }
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.7.11-SNAPSHOT'
    compileOnly 'org.spongepowered:mixin:0.7.11-SNAPSHOT'
    shade('org.spongepowered:mixin:0.7.11-SNAPSHOT') {
        transitive = false
    }

    shadow 'com.googlecode.mp4parser:isoparser:1.1.7'
    shadow 'org.apache.commons:commons-exec:1.3'
    shadow 'com.google.apis:google-api-services-youtube:v3-rev178-1.22.0', shadeExclusions
    shadow 'com.google.api-client:google-api-client-gson:1.20.0', shadeExclusions
    shadow 'com.google.api-client:google-api-client-java6:1.20.0', shadeExclusions
    shadow 'com.google.oauth-client:google-oauth-client-jetty:1.20.0'
    shadow 'com.github.javagl.JglTF:jgltf-model:3af6de4'
    shadow 'org.aspectj:aspectjrt:1.8.2'
    shadow 'com.github.ReplayMod.JavaBlend:2.79.0:a0696f8'
    shadow('com.github.ReplayMod:ReplayStudio:a1f82a7', shadeExclusions)
    // Development/IDE launches run against MCP names (for example Minecraft#getMinecraft).
    // This jar is a deterministic stable_12 SRG -> MCP remap of the exact production jar below.
    jguiDev('blank:jGui:1.7.10-a4cf260-dev') {
        transitive = false
    }
    // The release jar must continue to embed the production/SRG jGui bytecode; Shadow relocates it below.
    jguiProduction('blank:jGui:1.7.10-a4cf260') {
        transitive = false
    }
    shadow 'com.github.ReplayMod:lwjgl-utils:27dcd66'

    testCompile 'junit:junit:4.11'
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs += [
            "-AoutSrgFile=${project.mixinSrg.canonicalPath}",
            "-AoutRefMapFile=${project.mixinRefMap.canonicalPath}",
            "-AreobfSrgFile=${project.file('build/mcp-srg.srg').canonicalPath}"
    ]
}

File configureRelocationOutput = new File(project.buildDir, 'configureRelocation')
task configureRelocation() {
    dependsOn tasks.jar
    dependsOn configurations.shadow
    outputs.file(configureRelocationOutput)
    doLast {
        def pkgs = files(configurations.shadow).filter { it.exists() }.collect {
            def tree = it.isDirectory() ? fileTree(it) : zipTree(it)
            def pkgs = [].toSet()
            tree.visit { file ->
                if (!file.directory && file.name.endsWith('.class') && file.path.contains('/')) {
                    def pkg = file.path.substring(0, file.path.lastIndexOf('/')) + '/'
                    if (pkg.startsWith('com/')) {
                        if (pkg.startsWith('com/google/')) {
                            if (!pkg.startsWith('com/google/common')) {
                                def end = pkg.indexOf('/', 'com/google/'.length())
                                if (end > 0) pkgs << pkg.substring(0, end)
                            }
                        } else if (!pkg.startsWith('com/replaymod')) {
                            def end = pkg.indexOf('/', 4)
                            if (end > 0) pkgs << pkg.substring(0, end)
                        }
                    } else if (pkg.startsWith('net/')) {
                        if (!pkg.startsWith('net/minecraft')) {
                            def end = pkg.indexOf('/', 'net/'.length())
                            if (end > 0) pkgs << pkg.substring(0, end)
                        }
                    } else if (pkg.startsWith('org/')) {
                        if (pkg.startsWith('org/apache/')) {
                            if (pkg.startsWith('org/apache/commons/')) {
                                if (!pkg.startsWith('org/apache/commons/io')) {
                                    def end = pkg.indexOf('/', 'org/apache/commons/'.length())
                                    if (end > 0) pkgs << pkg.substring(0, end)
                                }
                            } else if (!pkg.startsWith('org/apache/logging')) {
                                def end = pkg.indexOf('/', 'org/apache/'.length())
                                if (end > 0) pkgs << pkg.substring(0, end)
                            }
                        } else if (!pkg.startsWith('org/lwjgl') && !pkg.startsWith('org/spongepowered')) {
                            def end = pkg.indexOf('/', 4)
                            if (end > 0) pkgs << pkg.substring(0, end)
                        }
                    } else if (!pkg.startsWith('javax/')) {
                        def i = pkg.indexOf('/')
                        def i2 = pkg.indexOf('/', i + 1)
                        if (i2 > 0) pkgs << pkg.substring(0, i2)
                    }
                }
            }
            pkgs
        }.flatten().unique()
        configureRelocationOutput.parentFile.mkdirs()
        configureRelocationOutput.write(pkgs.join('\n'))
    }
}

tasks.removeByName('shadowJar')
task shadowJar(type: ShadowJar) {
    from { tasks.jar.archiveFile.get() }
    dependsOn { tasks.reobf }

    from({ zipTree(project.configurations.jguiProduction.singleFile) }) {
        // The pinned GUI atlas is tracked as a normal ReplayMod resource so Forge's dev resource manager can see it.
        // Avoid adding a second copy from the production jGui jar when creating the shaded release.
        exclude 'assets/jgui/**'
        filesMatching('mixins.jgui.json') {
            filter { line ->
                def trimmed = line.trim()
                if (trimmed.startsWith('//#') || trimmed.startsWith('//$$')) {
                    return ''
                }
                return line.replace('de.johni0702', 'com.replaymod.lib.de.johni0702')
            }
        }
        filesMatching('mixins.jgui.refmap.json') {
            filter { line -> line.replace('de/johni0702', 'com/replaymod/lib/de/johni0702') }
        }
    }
    relocate 'de.johni0702', 'com.replaymod.lib.de.johni0702'
    manifest.inheritFrom tasks.jar.manifest

    from project.configurations.shade
    configurations = [project.configurations.shadow]
    exclude 'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'

    dependsOn tasks.configureRelocation
    inputs.file(configureRelocationOutput)
    doFirst {
        configureRelocationOutput.readLines().each { pkg ->
            def pkgName = pkg.replace('/', '.')
            relocate pkgName, 'com.replaymod.lib.' + pkgName
        }
    }

    minimize {
        exclude(dependency('.*spongepowered:mixin:.*'))
    }

    // ForgeGradle/reobf needs the raw JAR as an intermediate input, but it is
    // not a distributable artifact. Remove it only after the shaded release
    // has been assembled successfully so build/libs contains one usable JAR.
    doLast {
        def rawJar = tasks.jar.archiveFile.get().asFile
        if (rawJar.exists() && !rawJar.delete()) {
            throw new GradleException("Could not remove intermediate JAR: ${rawJar}")
        }
    }
}

tasks.assemble.dependsOn tasks.shadowJar

jar {
    classifier = 'raw'
    from files(project.mixinRefMap.canonicalPath)
    manifest {
        attributes(
                'TweakClass': 'com.replaymod.core.tweaker.ReplayModTweaker',
                'TweakOrder': '0',
                'FMLCorePlugin': 'com.replaymod.core.LoadingPlugin',
                'FMLCorePluginContainsFMLMod': 'true',
                'ForceLoadAsMod': 'true',
                'FMLAT': 'replaymod_at.cfg'
        )
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraftBaseVersion
    filesMatching(['mcmod.info']) {
        expand 'version': project.version, 'mcversion': project.minecraftBaseVersion
    }
}

task copySrg(type: Copy, dependsOn: 'genSrgs') {
    from { project.tasks.genSrgs.mcpToSrg }
    into 'build'
}
compileJava.dependsOn copySrg

reobf.addExtraSrgFile project.mixinSrg

defaultTasks 'build'
